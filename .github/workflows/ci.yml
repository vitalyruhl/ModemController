name: CI

on:
  push:
    branches: [main, docs/python-modem-upgrade-plan]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Build a clean-source candidate bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  quality:
    name: Windows quality (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Synchronize locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Build package
        run: uv build

  portable:
    name: Windows portable bundle
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Synchronize locked environment
        run: uv sync --frozen
      - name: Build portable bundle
        run: |
          if ("${{ inputs.candidate }}" -eq "true") {
            uv run --frozen --no-sync python tools/build_portable.py --candidate
          } else {
            uv run --frozen --no-sync python tools/build_portable.py
          }
      - name: Smoke frozen GUI and console
        run: |
          $archive = Get-ChildItem dist -Filter *.zip | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $archive) { throw "Portable archive was not created" }
          uv run --frozen --no-sync python tools/verify_candidate.py $archive.FullName --smoke
      - name: Upload portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modem-controller-portable
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
