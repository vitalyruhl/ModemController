[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "modem-controller-rs232"
dynamic = ["version"]
description = "Portable Windows modem terminal and diagnostics application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
dependencies = [
    "pyserial==3.5",
    "pyside6==6.11.2",
]

[project.scripts]
modem-console = "modem_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
modem_controller = ["catalog/data/*.json", "tool_data/*.json", "tool_data/*.ps1", "tool_data/plugins/*/*.json", "tool_data/plugins/*/*.ps1"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "version.json" }, { dir = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.8",
]
